<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业数据大屏 - 完整版</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1b2a;
            color: #e0e1dd;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: linear-gradient(90deg, #0d1b2a 0%, #1b3a4b 50%, #0d1b2a 100%);
            border-bottom: 2px solid #48cae4;
        }
        .header-left, .header-right {
            font-size: 14px;
            color: #90e0ef;
        }
        .header h1 {
            font-size: 32px;
            letter-spacing: 10px;
            background: linear-gradient(90deg, #48cae4, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 25% 50% 25%;
            grid-template-rows: auto auto;
            gap: 15px;
            padding: 15px;
        }
        .panel {
            background: rgba(27, 58, 75, 0.4);
            border: 1px solid rgba(72, 202, 228, 0.2);
            border-radius: 8px;
            padding: 15px;
        }
        .panel-title {
            font-size: 16px;
            color: #48cae4;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(72, 202, 228, 0.3);
        }
        .chart-container {
            width: 100%;
            height: 280px;
        }
        .center-top {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 0;
        }
        .kpi-card {
            text-align: center;
            padding: 15px 25px;
            background: rgba(72, 202, 228, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(72, 202, 228, 0.3);
        }
        .kpi-number {
            font-size: 28px;
            font-weight: bold;
            color: #48cae4;
        }
        .kpi-name {
            font-size: 13px;
            color: #adb5bd;
            margin-top: 5px;
        }
        .center-map {
            height: 400px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .data-table th {
            background: rgba(72, 202, 228, 0.2);
            color: #48cae4;
            padding: 10px;
            text-align: left;
        }
        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(72, 202, 228, 0.1);
            color: #e0e1dd;
        }
        .data-table tr:hover td {
            background: rgba(72, 202, 228, 0.1);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left" id="currentDate"></div>
        <h1>企业运营数据大屏</h1>
        <div class="header-right">数据实时更新中</div>
    </div>

    <div class="dashboard">
        <!-- 左侧面板 -->
        <div class="left-column">
            <div class="panel">
                <div class="panel-title">品类占比</div>
                <div id="categoryChart" class="chart-container"></div>
            </div>
            <div class="panel">
                <div class="panel-title">区域销量分布</div>
                <div id="regionChart" class="chart-container"></div>
            </div>
        </div>

        <!-- 中间面板 -->
        <div class="center-column">
            <div class="panel center-top">
                <div class="kpi-card">
                    <div class="kpi-number" id="kpiRevenue">¥3,256万</div>
                    <div class="kpi-name">年度总营收</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-number" id="kpiOrders">15,280</div>
                    <div class="kpi-name">订单总量</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-number" id="kpiAvg">¥2,130</div>
                    <div class="kpi-name">客均单价</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-number" id="kpiSat">96.2%</div>
                    <div class="kpi-name">客户满意度</div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-title">销售趋势分析</div>
                <div id="trendChart" class="chart-container" style="height: 350px;"></div>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="right-column">
            <div class="panel">
                <div class="panel-title">渠道销售对比</div>
                <div id="channelChart" class="chart-container"></div>
            </div>
            <div class="panel">
                <div class="panel-title">实时订单</div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>订单号</th>
                            <th>产品</th>
                            <th>金额</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="orderTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 显示当前日期
        var now = new Date();
        document.getElementById('currentDate').textContent =
            now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';

        // 品类占比 - 饼图
        var categoryChart = echarts.init(document.getElementById('categoryChart'));
        var categoryOption = {
            tooltip: {
                trigger: 'item',
                formatter: '{a} <br/>{b}: {c} ({d}%)',
                backgroundColor: 'rgba(13,27,42,0.9)',
                borderColor: '#48cae4',
                textStyle: { color: '#e0e1dd' }
            },
            legend: {
                orient: 'vertical',
                right: 5,
                top: 'center',
                textStyle: { color: '#90e0ef', fontSize: 11 },
                itemWidth: 12,
                itemHeight: 12
            },
            series: [{
                name: '品类占比',
                type: 'pie',
                radius: ['35%', '65%'],
                center: ['35%', '50%'],
                avoidLabelOverlap: false,
                itemStyle: {
                    borderRadius: 8,
                    borderColor: '#0d1b2a',
                    borderWidth: 2
                },
                label: { show: false },
                emphasis: {
                    label: {
                        show: true,
                        fontSize: 16,
                        fontWeight: 'bold',
                        color: '#fff'
                    }
                },
                data: [
                    { value: 1248, name: '电子数码' },
                    { value: 835, name: '家用电器' },
                    { value: 680, name: '服装配饰' },
                    { value: 534, name: '食品饮料' },
                    { value: 420, name: '美妆护肤' },
                    { value: 310, name: '家居用品' }
                ]
            }]
        };
        categoryChart.setOption(categoryOption);

        // 区域销量分布 - 柱状图
        var regionChart = echarts.init(document.getElementById('regionChart'));
        var regionOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                backgroundColor: 'rgba(13,27,42,0.9)',
                borderColor: '#48cae4'
            },
            grid: { left: '3%', right: '8%', bottom: '3%', containLabel: true },
            xAxis: {
                type: 'category',
                data: ['华东', '华南', '华北', '西南', '华中', '西北', '东北'],
                axisLabel: { color: '#adb5bd', fontSize: 11 },
                axisLine: { lineStyle: { color: '#334455' } }
            },
            yAxis: {
                type: 'value',
                axisLabel: { color: '#adb5bd' },
                splitLine: { lineStyle: { color: 'rgba(72,202,228,0.1)' } }
            },
            series: [{
                name: '销量',
                type: 'bar',
                barWidth: '45%',
                data: [3800, 3200, 2800, 2100, 1900, 1100, 850],
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#48cae4' },
                        { offset: 1, color: '#023e8a' }
                    ]),
                    borderRadius: [4, 4, 0, 0]
                }
            }]
        };
        regionChart.setOption(regionOption);

        // 销售趋势 - 折线图
        var trendChart = echarts.init(document.getElementById('trendChart'));
        var trendOption = {
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(13,27,42,0.9)',
                borderColor: '#48cae4'
            },
            legend: {
                data: ['2023年', '2024年'],
                textStyle: { color: '#90e0ef' },
                top: 5
            },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                axisLabel: { color: '#adb5bd' },
                axisLine: { lineStyle: { color: '#334455' } }
            },
            yAxis: {
                type: 'value',
                axisLabel: { color: '#adb5bd' },
                splitLine: { lineStyle: { color: 'rgba(72,202,228,0.1)' } }
            },
            series: [
                {
                    name: '2023年',
                    type: 'line',
                    smooth: true,
                    data: [190, 210, 235, 225, 255, 275, 265, 290, 315, 340, 370, 400],
                    lineStyle: { color: '#0077b6', width: 2 },
                    areaStyle: { color: 'rgba(0,119,182,0.1)' }
                },
                {
                    name: '2024年',
                    type: 'line',
                    smooth: true,
                    data: [220, 240, 270, 260, 290, 310, 300, 330, 360, 390, 420, 450],
                    lineStyle: { color: '#48cae4', width: 3 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(72,202,228,0.3)' },
                            { offset: 1, color: 'rgba(72,202,228,0)' }
                        ])
                    }
                }
            ]
        };
        trendChart.setOption(trendOption);

        // 渠道销售对比
        var channelChart = echarts.init(document.getElementById('channelChart'));
        var channelOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                backgroundColor: 'rgba(13,27,42,0.9)',
                borderColor: '#48cae4'
            },
            legend: {
                data: ['2023年', '2024年'],
                textStyle: { color: '#90e0ef' },
                top: 5
            },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: {
                type: 'value',
                axisLabel: { color: '#adb5bd' },
                splitLine: { lineStyle: { color: 'rgba(72,202,228,0.1)' } }
            },
            yAxis: {
                type: 'category',
                data: ['线上商城', '实体门店', '分销商', '社交电商', '直播带货'],
                axisLabel: { color: '#adb5bd' },
                axisLine: { lineStyle: { color: '#334455' } }
            },
            series: [
                {
                    name: '2023年',
                    type: 'bar',
                    data: [380, 320, 270, 220, 180],
                    itemStyle: { color: '#457b9d' }
                },
                {
                    name: '2024年',
                    type: 'bar',
                    data: [520, 350, 310, 420, 480],
                    itemStyle: { color: '#48cae4' }
                }
            ]
        };
        channelChart.setOption(channelOption);

        // 模拟实时订单数据
        var orders = [
            { no: 'ORD-2024-001', product: '智能手机X1', amount: '¥3,999', status: '已完成' },
            { no: 'ORD-2024-002', product: '空气净化器', amount: '¥1,299', status: '配送中' },
            { no: 'ORD-2024-003', product: '运动鞋Pro', amount: '¥699', status: '已付款' },
            { no: 'ORD-2024-004', product: '进口零食包', amount: '¥259', status: '已完成' },
            { no: 'ORD-2024-005', product: '护肤套装', amount: '¥899', status: '待发货' },
            { no: 'ORD-2024-006', product: '智能音箱', amount: '¥499', status: '已完成' },
            { no: 'ORD-2024-007', product: '机械键盘', amount: '¥599', status: '配送中' }
        ];

        function renderOrders() {
            var tbody = document.getElementById('orderTable');
            tbody.innerHTML = orders.map(function(o) {
                var color = o.status === '已完成' ? '#52b788' : o.status === '配送中' ? '#48cae4' : '#f4a261';
                return '<tr><td>' + o.no + '</td><td>' + o.product + '</td><td>' + o.amount +
                       '</td><td style="color:' + color + '">' + o.status + '</td></tr>';
            }).join('');
        }
        renderOrders();

        // 窗口自适应
        window.addEventListener('resize', function() {
            categoryChart.resize();
            regionChart.resize();
            trendChart.resize();
            channelChart.resize();
        });
    </script>
</body>
</html>
